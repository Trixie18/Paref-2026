<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: "#101a2b", "navy-light": "#1c2b45", background: "#faf9f6", foreground: "#16191f",
          accent: "#c2760a", "accent-dark": "#9c5f08", border: "#e3e0d8", muted: "#6b6f76",
          surface: "#ffffff", danger: "#b3261e", success: "#2f6f4e",
        },
        fontFamily: { sans: ["Inter", "system-ui", "-apple-system", "sans-serif"] },
      },
    },
  };
</script>

<body class="bg-background text-foreground">
  <div class="flex min-h-screen flex-col">
    <div id="nav" data-nav-type="parent" data-nav-page="shop"></div>
    <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-6 pb-24 sm:pb-6">
      <div class="page-header">
        <div>
          <h1 class="page-title">Event Shop</h1>
          <p class="page-subtitle">Shirts, individual items, and bundles for the event.</p>
        </div>
      </div>

      <div id="error-banner" class="error-banner mb-4" hidden></div>
      <div id="loading" class="page-spinner"><span class="spinner spinner-lg"></span></div>

      <div id="shop-content" hidden>
        <section class="mb-10">
          <h2 class="mb-3 text-base font-semibold text-navy">Event Shirts</h2>
          <div id="shirts-empty" class="empty-state" hidden><p class="font-medium text-foreground">No shirts available right now</p></div>
          <div id="shirts-grid" class="grid grid-cols-1 gap-3 sm:grid-cols-2"></div>
        </section>

        <section class="mb-10">
          <h2 class="mb-3 text-base font-semibold text-navy">Individual Event Items</h2>
          <div id="items-empty" class="empty-state" hidden><p class="font-medium text-foreground">No items available right now</p></div>
          <div id="items-grid" class="grid grid-cols-1 gap-3 sm:grid-cols-2"></div>
        </section>

        <section>
          <h2 class="mb-3 text-base font-semibold text-navy">Bundles</h2>
          <div id="bundles-empty" class="empty-state" hidden><p class="font-medium text-foreground">No bundles available right now</p></div>
          <div id="bundles-grid" class="grid grid-cols-1 gap-3 sm:grid-cols-2"></div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/assets/js/nav.js"></script>
  <script type="module" src="/assets/js/pages/shop.js"></script>
</body>
