<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: "#101a2b", "navy-light": "#1c2b45", background: "#faf9f6", foreground: "#16191f",
          accent: "#c2760a", "accent-dark": "#9c5f08", border: "#e3e0d8", muted: "#6b6f76",
          surface: "#ffffff", danger: "#b3261e", success: "#2f6f4e",

<body class="bg-background text-foreground">
  <div class="flex min-h-screen flex-col">
    <div id="nav" data-nav-type="parent" data-nav-page="players"></div>
    <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-6 pb-24 sm:pb-6">
      <div class="mx-auto max-w-lg">
        <div class="page-header">
          <h1 id="page-title" class="page-title">Add Player</h1>
          <a href="/players.html" class="btn btn-ghost btn-sm">Back</a>
        </div>

        <div id="loading" class="page-spinner"><span class="spinner spinner-lg"></span></div>

        <form id="player-form" novalidate class="flex flex-col gap-4" hidden>
          <div class="field-wrapper">
            <label for="player-name" class="field-label">Player name</label>
            <input id="player-name" name="playerName" type="text" class="input-base" />
          </div>
          <div class="field-wrapper">
            <label for="team" class="field-label">Team</label>
            <input id="team" name="team" type="text" placeholder="e.g. Blue" class="input-base" />
          </div>
          <div class="field-wrapper">
            <label for="age-group" class="field-label">Age group</label>
            <input id="age-group" name="ageGroup" type="text" placeholder="e.g. U12" class="input-base" />
          </div>
          <div class="field-wrapper">
            <label for="jersey-number" class="field-label">Jersey number</label>
            <input id="jersey-number" name="jerseyNumber" type="text" placeholder="e.g. 7" class="input-base" />
          </div>

          <div id="error-banner" class="error-banner" hidden></div>
          <p id="saved-message" class="text-sm text-success" hidden>Player updated.</p>

          <button type="submit" id="submit-btn" class="btn btn-primary btn-lg btn-full">Save Player</button>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="/assets/js/nav.js"></script>
  <script type="module" src="/assets/js/pages/player-form.js"></script>
</body>
</html>
