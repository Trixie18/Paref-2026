<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: "#101a2b", "navy-light": "#1c2b45", background: "#faf9f6", foreground: "#16191f",
          accent: "#c2760a", "accent-dark": "#9c5f08", border: "#e3e0d8", muted: "#6b6f76",
          surface: "#ffffff", danger: "#b3261e", success: "#2f6f4e",
        },
        fontFamily: { sans: ["Inter", "system-ui", "-apple-system", "sans-serif"] },
      },
    },
  };
</script>
<link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body class="bg-background text-foreground">
  <div class="flex min-h-screen flex-col bg-background">
    <div id="nav" data-nav-type="admin" data-nav-page="products"></div>
    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6">
      <div class="page-header">
        <h1 class="page-title">Products</h1>
        <button id="new-product-btn" class="btn btn-primary btn-sm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
          New Product
        </button>
      </div>

      <div class="relative mb-4 sm:max-w-xs">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m19.5 19.5-4.3-4.3" /></svg>
        <input id="search-input" placeholder="Search products" class="h-10 w-full rounded-md border border-border bg-surface pl-9 pr-3 text-sm focus:outline-none focus:ring-2 focus:ring-navy/30" />
      </div>

      <div id="error-banner" class="error-banner mb-4" hidden></div>
      <div id="loading" class="page-spinner"><span class="spinner spinner-lg"></span></div>
      <p id="no-results" class="py-10 text-center text-sm text-muted" hidden>No products found.</p>

      <div class="overflow-x-auto rounded-lg border border-border bg-surface" id="table-wrap" hidden>
        <table class="w-full min-w-[760px] text-sm">
          <thead>
            <tr class="border-b border-border text-left text-xs uppercase tracking-wide text-muted">
              <th class="px-4 py-3">ID</th>
              <th class="px-4 py-3">Name</th>
              <th class="px-4 py-3">Category</th>
              <th class="px-4 py-3">Price</th>
              <th class="px-4 py-3">Stock</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="product-rows" class="divide-y divide-border"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>

  <script type="module" src="/assets/js/nav.js"></script>
  <script type="module" src="/assets/js/pages/admin-products.js"></script>
</body>
</html>
