<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: "#101a2b", "navy-light": "#1c2b45", background: "#faf9f6", foreground: "#16191f",
          accent: "#c2760a", "accent-dark": "#9c5f08", border: "#e3e0d8", muted: "#6b6f76",
          surface: "#ffffff", danger: "#b3261e", success: "#2f6f4e",
        },
        fontFamily: { sans: ["Inter", "system-ui", "-apple-system", "sans-serif"] },
      },
    },
  };
</script>
<link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body class="bg-background text-foreground">
  <div class="flex min-h-screen flex-col bg-background">
    <div id="nav" data-nav-type="admin" data-nav-page="orders"></div>
    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6">
      <div class="page-header">
        <h1 class="page-title">Order Detail</h1>
        <a href="/admin/orders.html" class="btn btn-ghost btn-sm">Back to Orders</a>
      </div>

      <div id="error-banner" class="error-banner mb-4" hidden></div>
      <div id="loading" class="page-spinner"><span class="spinner spinner-lg"></span></div>

      <div id="order-content" class="flex flex-col gap-4" hidden>
        <div id="order-detail"></div>

        <div class="card p-4">
          <h2 class="mb-3 text-sm font-semibold text-navy">Update Status</h2>
          <div id="claimed-banner" class="info-banner warning mb-3" hidden></div>
          <div id="warning-banner" class="info-banner warning mb-3" hidden></div>

          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <div class="field-wrapper">
              <label class="field-label">Payment status</label>
              <select id="payment-status-select" class="input-base">
                <option value="PENDING">PENDING</option>
                <option value="PAID">PAID</option>
                <option value="FAILED">FAILED</option>
                <option value="CANCELLED">CANCELLED</option>
              </select>
            </div>
            <div class="field-wrapper">
              <label class="field-label">Fulfillment status</label>
              <select id="fulfillment-status-select" class="input-base">
                <option value="PENDING">PENDING</option>
                <option value="READY">READY</option>
                <option value="CLAIMED">CLAIMED</option>
                <option value="CANCELLED">CANCELLED</option>
              </select>
            </div>
          </div>

          <div class="mt-4">
            <button id="update-btn" class="btn btn-primary btn-md">Update Status</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/assets/js/nav.js"></script>
  <script type="module" src="/assets/js/pages/admin-order.js"></script>
</body>
</html>
