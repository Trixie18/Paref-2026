<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: "#101a2b", "navy-light": "#1c2b45", background: "#faf9f6", foreground: "#16191f",
          accent: "#c2760a", "accent-dark": "#9c5f08", border: "#e3e0d8", muted: "#6b6f76",
          surface: "#ffffff", danger: "#b3261e", success: "#2f6f4e",
        },
        fontFamily: { sans: ["Inter", "system-ui", "-apple-system", "sans-serif"] },
      },
    },
  };
</script>
<link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body class="bg-background text-foreground">
  <div class="flex min-h-screen flex-col">
    <div id="nav" data-nav-type="parent" data-nav-page="profile"></div>
    <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-6 pb-24 sm:pb-6">
      <div class="mx-auto max-w-lg">
        <div class="page-header"><h1 class="page-title">My Profile</h1></div>

        <div id="loading" class="page-spinner"><span class="spinner spinner-lg"></span></div>

        <form id="profile-form" novalidate class="flex flex-col gap-4" hidden>
          <div class="field-wrapper">
            <label for="email" class="field-label">Email address</label>
            <input id="email" name="email" type="text" class="input-base" disabled readonly />
            <p class="field-hint">Contact an event organizer to change your email.</p>
          </div>
          <div class="field-wrapper">
            <label for="name" class="field-label">Full name</label>
            <input id="name" name="name" type="text" class="input-base" />
          </div>
          <div class="field-wrapper">
            <label for="phone" class="field-label">Mobile number</label>
            <input id="phone" name="phone" type="tel" class="input-base" />
          </div>

          <div id="error-banner" class="error-banner" hidden></div>
          <p id="saved-message" class="text-sm text-success" hidden>Profile updated.</p>

          <button type="submit" id="submit-btn" class="btn btn-primary btn-lg btn-full">Save Changes</button>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="/assets/js/nav.js"></script>
  <script type="module" src="/assets/js/pages/profile.js"></script>
</body>
</html>
