<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: "#101a2b", "navy-light": "#1c2b45", background: "#faf9f6", foreground: "#16191f",
          accent: "#c2760a", "accent-dark": "#9c5f08", border: "#e3e0d8", muted: "#6b6f76",
          surface: "#ffffff", danger: "#b3261e", success: "#2f6f4e",

      },
    },
  };
</script>

<body class="bg-background text-foreground">
  <div class="flex min-h-screen flex-col">
    <div id="nav" data-nav-type="parent" data-nav-page="cart"></div>
    <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-6 pb-24 sm:pb-6">
      <div class="page-header"><h1 class="page-title">Your Cart</h1></div>

      <div id="empty-state" class="empty-state" hidden>
        <p class="font-medium text-foreground">Your cart is empty</p>
        <p class="max-w-sm text-sm text-muted">Add shirts, items, or bundles from the shop.</p>
        <a href="/shop.html" class="btn btn-primary btn-sm">Go to Shop</a>
      </div>

      <div id="cart-content" hidden>
        <div id="error-banner" class="error-banner mb-4" hidden></div>

        <ul id="cart-lines" class="flex flex-col divide-y divide-border rounded-lg border border-border bg-surface"></ul>

        <div class="mt-4 flex items-center justify-between rounded-lg border border-border bg-surface px-4 py-3.5">
          <span class="font-medium text-foreground">Total</span>
          <span id="cart-total" class="text-lg font-semibold text-navy"><span class="spinner"></span></span>
        </div>

        <div class="mt-5 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
          <a href="/shop.html" class="btn btn-outline btn-lg btn-full sm:order-1">Continue Shopping</a>
          <a id="checkout-link" href="/checkout.html" class="btn btn-primary btn-lg btn-full sm:w-auto">Checkout</a>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/assets/js/nav.js"></script>
  <script type="module" src="/assets/js/pages/cart.js"></script>
</body>
