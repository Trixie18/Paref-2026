<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: "#101a2b", "navy-light": "#1c2b45", background: "#faf9f6", foreground: "#16191f",
          accent: "#c2760a", "accent-dark": "#9c5f08", border: "#e3e0d8", muted: "#6b6f76",
          surface: "#ffffff", danger: "#b3261e", success: "#2f6f4e",
        },
        fontFamily: { sans: ["Inter", "system-ui", "-apple-system", "sans-serif"] },
      },
    },
  };
</script>
<link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body class="bg-background text-foreground">
  <div class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-4 py-10">
    <div class="mb-8 flex flex-col items-center gap-2">
      <svg width="40" height="44" viewBox="0 0 40 44" fill="none" aria-hidden="true">
        <path d="M20 2 36 8v12c0 12-7 18.5-16 22C11 38.5 4 32 4 20V8L20 2Z" fill="#101a2b" stroke="#c2760a" stroke-width="1.5" />
        <path d="M20 8 30 12v8c0 8.5-5 13-10 15.5C15 33.5 10 29 10 20v-8l10-4Z" fill="none" stroke="#faf9f6" stroke-width="1" />
        <text x="20" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#faf9f6" font-family="Georgia, serif">P</text>
      </svg>
      <h1 class="text-xl font-semibold text-navy">Create your parent account</h1>
      <p class="text-center text-sm text-muted">Register once to add players and shop for the event.</p>
    </div>

    <form id="register-form" novalidate class="flex flex-col gap-4">
      <div class="field-wrapper">
        <label for="name" class="field-label">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" class="input-base" />
        <p id="name-error" class="field-error" hidden></p>
      </div>
      <div class="field-wrapper">
        <label for="email" class="field-label">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" class="input-base" />
        <p id="email-error" class="field-error" hidden></p>
      </div>
      <div class="field-wrapper">
        <label for="phone" class="field-label">Mobile number</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="09171234567" class="input-base" />
        <p id="phone-error" class="field-error" hidden></p>
      </div>
      <div class="field-wrapper">
        <label for="password" class="field-label">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" class="input-base" />
        <p id="password-hint" class="field-hint">At least 6 characters.</p>
        <p id="password-error" class="field-error" hidden></p>
      </div>
      <div class="field-wrapper">
        <label for="confirm-password" class="field-label">Confirm password</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" class="input-base" />
        <p id="confirm-password-error" class="field-error" hidden></p>
      </div>

      <div id="form-error" class="error-banner" hidden></div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-lg btn-full">Register</button>
    </form>

    <p class="mt-6 text-center text-sm text-muted">
      Already registered? <a href="/login.html" class="font-medium text-navy hover:underline">Log in</a>
    </p>
  </div>

  <script type="module" src="/assets/js/pages/register.js"></script>
</body>
</html>
